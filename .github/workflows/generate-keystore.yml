name: 生成签名密钥（只需运行一次）

# 手动运行一次：在仓库里创建 signing/maotv.jks 和 signing/signing.properties。
# 以后“Build APK”会自动用它签名（V1 + V2 + V3）。已经存在就不会覆盖。
# 注意：密钥和密码都存放在你的【私有仓库】里，请不要把仓库改成公开。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate keystore
        run: |
          if [ -f signing/maotv.jks ]; then
            echo "signing/maotv.jks 已存在，不覆盖。"
            exit 0
          fi
          mkdir -p signing
          PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore signing/maotv.jks -storetype PKCS12 \
            -alias maotv -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=MaoTV, OU=cncat, O=cncat, C=CN"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=maotv\n' "$PASS" "$PASS" > signing/signing.properties
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f signing
          git commit -m "Add release signing key"
          git push
