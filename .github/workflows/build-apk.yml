name: Build APK

# 只在你手动点 “Run workflow” 时才编译（改文件、推送都不会自动编译）
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK（ANDROID_HOME），这里只补装需要的版本
      - name: Install SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 可选：如果在仓库 Secrets 里配置了 KEYSTORE_BASE64，就用它签名（优先于 signing/ 目录）
      - name: Prepare keystore from secrets
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK (arm64-v8a)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signature
        run: |
          ls -la app/build/outputs/apk/release/
          for f in app/build/outputs/apk/release/*.apk; do
            echo "== $f"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$f" || echo "(未签名或验证失败)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: MaoTV-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
