name: Build unsigned APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK（ANDROID_HOME），这里只补装需要的版本
      - name: Install SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APKs (unsigned, one per ABI)
        run: gradle --no-daemon :app:assembleRelease

      - name: List outputs
        run: ls -la app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: MaoTV-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
