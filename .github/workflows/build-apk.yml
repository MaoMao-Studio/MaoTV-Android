name: Build APK

# 只在你手动点 “Run workflow” 时才编译（改文件、推送都不会自动编译）
on:
  workflow_dispatch:

jobs:
  build:
    # 本地 Mac mini 自托管 Runner（MaoMaoGe-MacMini）
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 自托管 Mac 上不一定预装 Android SDK：找不到就装到 ~/android-sdk（只第一次下载，之后复用）
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            for d in "$HOME/Library/Android/sdk" "$HOME/android-sdk"; do
              [ -d "$d" ] && SDK="$d" && break
            done
          fi
          [ -n "$SDK" ] || SDK="$HOME/android-sdk"
          mkdir -p "$SDK"
          SDKM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          if [ -z "$SDKM" ]; then
            echo "下载 Android 命令行工具…"
            curl -fL -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip
            rm -rf "$RUNNER_TEMP/cmdtools" && mkdir -p "$RUNNER_TEMP/cmdtools"
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdtools"
            mkdir -p "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$RUNNER_TEMP/cmdtools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-35" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 可选：如果在仓库 Secrets 里配置了 KEYSTORE_BASE64，就用它签名（优先于 signing/ 目录）
      - name: Prepare keystore from secrets
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK (arm64-v8a)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signature
        run: |
          ls -la app/build/outputs/apk/release/
          for f in app/build/outputs/apk/release/*.apk; do
            echo "== $f"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$f" || echo "(未签名或验证失败)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: MaoTV-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
